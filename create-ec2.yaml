---
- name: Create EC2 Instance
  hosts: local
  connection: local
  gather_facts: false

  vars:
    aws_access_key: "AKIAW6232T3KZKXXE6UF"
    aws_secret_key: "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"
    aws_region: ap-south-1

  tasks:
    - name: Launch Ubuntu t3.micro
      amazon.aws.ec2_instance:
        access_key: "{{ aws_access_key }}"
        secret_key: "{{ aws_secret_key }}"
        region: "{{ aws_region }}"
        name: my-ubuntu-server
        instance_type: t3.micro
        image_id: ami-0fc5d935ebf8bc3bc   # Ubuntu 22.04 LTS (us-east-1)
        state: running
        wait: true
      register: ec2

    - name: Show instance details
      debug:
        msg:
          - "Instance ID : {{ ec2.instances[0].instance_id }}"
          - "Public IP   : {{ ec2.instances[0].public_ip_address | default('N/A') }}"
          
